<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b5cab"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.json"><title>Avalúos - Captura iPhone</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f6f9;color:#17212b}header{position:sticky;top:0;z-index:5;background:#0b5cab;color:#fff;padding:14px 16px calc(12px + env(safe-area-inset-top));box-shadow:0 2px 8px #0002}h1{font-size:20px;margin:0}header small{opacity:.85}.wrap{max-width:900px;margin:auto;padding:12px 12px 90px}.tabs{display:flex;gap:7px;overflow:auto;position:sticky;top:72px;z-index:4;background:#f3f6f9;padding:7px 0}.tabs button{border:0;background:#fff;padding:10px 13px;border-radius:20px;white-space:nowrap;font-weight:700;color:#31536f}.tabs button.active{background:#0b5cab;color:#fff}.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 1px 5px #0001}h2{font-size:17px;margin:0 0 12px}label{display:block;font-weight:700;font-size:13px;margin:10px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5df;border-radius:10px;font-size:16px;background:#fff}textarea{min-height:90px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.full{grid-column:1/-1}.btn{border:0;border-radius:11px;padding:12px 14px;font-size:15px;font-weight:800;background:#0b5cab;color:#fff}.btn.secondary{background:#e9f0f7;color:#0b5cab}.btn.danger{background:#b42318}.btn.green{background:#16803c}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.photo{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #dde4eb;border-radius:12px;margin:7px 0}.photo img{width:70px;height:55px;object-fit:cover;border-radius:8px}.photo .meta{flex:1}.muted{color:#66788a;font-size:12px}.offer,.improve{border:1px solid #dde4eb;border-radius:12px;padding:12px;margin:8px 0}.hidden{display:none}.status{padding:10px;border-radius:10px;background:#eef6ff;color:#174a77;margin:8px 0}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:9px max(10px,env(safe-area-inset-left)) max(9px,env(safe-area-inset-bottom));display:flex;gap:8px;z-index:10}.bottom button{flex:1}.badge{display:inline-block;background:#e9f0f7;color:#31536f;padding:4px 8px;border-radius:10px;font-size:12px}.photo input{max-width:130px}.help{font-size:13px;line-height:1.45;color:#526475}
</style></head><body><header><h1>📐 Avalúos – Captura iPhone</h1><small>Basado en tu plantilla AVL-1368</small></header><div class="wrap"><div id="status" class="status">Listo para iniciar un avalúo.</div><nav class="tabs" id="tabs"></nav><main id="app"></main></div><div class="bottom"><button class="btn secondary" onclick="saveDraft()">💾 Guardar</button><button class="btn green" onclick="generateExcel()">📊 Generar Excel</button></div>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script><script>
const PHOTO_CATS=['Fachada inmueble o portería','Vista sobre vía','Distribución interna','Amenidades (PH)','Contadores / copropiedad','Entorno y sector','Vías de acceso','Nomenclatura','Sala','Comedor','Cocina','Zona de labores','Escalera','Baño social','Estudio','Alcoba 1','Baño privado','Alcoba 2','Hall de alcobas','Baño auxiliar','Alcoba 3','Balcón','Patio','Local','Vista interna local','Medidor de luz','Medidor de agua','Medidor de gas','Fachada vista 2'];
const state={tab:'Datos',data:{},photos:[],offers:[],improvements:[]};
const tabs=['Datos','Mercado','Mejoras','Fotos','GPS','Resumen'];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function inp(k,label,type='text',extra=''){return `<label>${label}<input id="${k}" type="${type}" value="${esc(state.data[k]||'')}" ${extra}></label>`}
function renderTabs(){document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="${state.tab===t?'active':''}" onclick="collect();persist();state.tab='${t}';render()">${t}</button>`).join('')}
function render(){renderTabs();const a=document.getElementById('app'); if(state.tab==='Datos')a.innerHTML=datos(); if(state.tab==='Mercado')a.innerHTML=mercado();if(state.tab==='Mejoras')a.innerHTML=mejoras();if(state.tab==='Fotos')a.innerHTML=fotos();if(state.tab==='GPS')a.innerHTML=gps();if(state.tab==='Resumen')a.innerHTML=resumen();}
function datos(){return `<section class="card"><h2>Datos del avalúo</h2><div class="grid">${inp('avaluo','Avalúo #','text','inputmode="numeric"')}${inp('fecha','Fecha de informe','date')}${inp('solicitante','Solicitante')}${inp('cliente','Cliente')}${inp('propietario','Propietario')}${inp('tipoIdentificacion','Tipo de identificación (CC/NIT/CE)')}${inp('identificacion','Identificación')}${inp('departamento','Departamento')}${inp('municipio','Municipio')}${inp('barrio','Barrio / Vereda')}${inp('direccion','Dirección')}${inp('matricula','Matrícula inmobiliaria')}${inp('estrato','Estrato','number')}${inp('areaLote','Área lote (m²)','number','step="0.01"')}${inp('areaConstruida','Área construida (m²)','number','step="0.01"')}${inp('condicion','Condición del predio (PH/NPH)')}${inp('tipoInmueble','Tipo de inmueble (casa/apto/lote)')}${inp('tipoSuelo','Tipo de suelo (Urbano/Rural)')}${inp('uso','Uso del inmueble')}${inp('titulo','Título de adquisición')}${inp('fuenteAreaTerreno','Fuente área de terreno')}${inp('fuenteAreaConstruida','Fuente área construida')}</div></section>
<section class="card"><h2>Información general y urbanística</h2><div class="grid">${inp('observaciones','Observaciones generales')}${inp('observacionesJuridicas','Observaciones jurídicas')}${inp('accesibilidad','Accesibilidad')}${inp('normatividad','Normatividad urbanística')}${inp('tratamiento','Tratamiento urbanístico')}${inp('edificabilidad','Edificabilidad')}${inp('usoSuelo','Uso del suelo')}${inp('actuaciones','Actuaciones urbanísticas')}${inp('observacionesUrbanisticas','Observaciones urbanísticas')}${inp('observacionesArea','Observaciones de áreas')}${inp('usoPredominante','Uso predominante del sector')}${inp('estadoVias','Estado de vías')}${inp('viasAcceso','Vías de acceso (Sí/No)')}${inp('viasPavimentadas','Vías pavimentadas (Sí/No)')}${inp('parques','Parques (Sí/No)')}${inp('zonasVerdes','Zonas verdes (Sí/No)')}${inp('sardineles','Sardineles (Sí/No)')}${inp('andenes','Andenes (Sí/No)')}${inp('ciclorrutas','Ciclorrutas (Sí/No)')}${inp('alamedas','Alamedas (Sí/No)')}${inp('alumbrado','Alumbrado público (Sí/No)')}${inp('transporte','Transporte público (Sí/No)')}${inp('alcantarillado','Alcantarillado (Sí/No)')}${inp('acueducto','Acueducto (Sí/No)')}${inp('gasNatural','Gas natural (Sí/No)')}${inp('energia','Energía eléctrica (Sí/No)')}</div></section>
<section class="card"><h2>Características constructivas</h2><div class="grid">${inp('habitaciones','Habitaciones','number')}${inp('banosPrivados','Baños privados','number')}${inp('banosSociales','Baños sociales','number')}${inp('salas','Salas','number')}${inp('comedores','Comedores','number')}${inp('balcones','Terrazas / balcones','number')}${inp('patios','Patios internos','number')}${inp('depositos','Depósitos','number')}${inp('estudio','Estudio','number')}${inp('garajes','Garajes','number')}${inp('cocinas','Cocinas','number')}${inp('pisos','Número de pisos','number')}${inp('fachada','Acabado de fachada')}${inp('ventaneria','Ventanería')}${inp('murosInternos','Muros internos')}${inp('acabadoPisos','Pisos')}${inp('acabadoBanos','Acabados de baños')}${inp('acabadoCocina','Acabado de cocina')}${inp('carpinteria','Carpintería')}${inp('vetustez','Vetustez / edad (años)','number')}${inp('vidaUtil','Vida útil (años)','number')}${inp('estadoConservacion','Estado conservación (1 a 5)','number')}${inp('estadoInmueble','Estado (Nuevo/Usado)')}${inp('habitado','Habitado (Sí/No)')}${inp('avanceObra','Avance de obra','number')}</div><label>Descripción técnica</label><textarea id="descripcion">${esc(state.data.descripcion||'')}</textarea></section>`}
function mercado(){return `<section class="card"><h2>Investigación de mercado</h2><p class="help">Agrega las ofertas que utilizas en el avalúo. Los datos se trasladarán a la hoja <b>EST MERCADO TERRENO</b>.</p>${state.offers.map((o,i)=>`<div class="offer"><b>Oferta ${i+1}</b><div class="grid">${inpO(i,'tipo','Tipo')}${inpO(i,'direccion','Dirección')}${inpO(i,'fuente','Fuente')}${inpO(i,'valor','Valor predio','number')}${inpO(i,'areaConstruida','Área construida','number')}${inpO(i,'areaTerreno','Área terreno','number')}${inpO(i,'negociacion','% negociación','number')}${inpO(i,'edad','Edad (años)','number')}${inpO(i,'vidaUtil','Vida útil (años)','number')}${inpO(i,'estado','Estado conservación (1 a 5)','number')}${inpO(i,'valorReposicion','Valor reposición por m²','number')}${inpO(i,'url','URL / enlace')}</div><button class="btn danger" onclick="state.offers.splice(${i},1);render()">Eliminar</button></div>`).join('')}<button class="btn" onclick="state.offers.push({tipo:'Casa'});render()">＋ Agregar oferta</button></section>`}
function inpO(i,k,l,type='text'){return `<label>${l}<input type="${type}" value="${esc(state.offers[i][k]||'')}" onchange="state.offers[${i}]['${k}']=this.value"></label>`}
function mejoras(){return `<section class="card"><h2>Anexo de mejoras</h2>${state.improvements.map((x,i)=>`<div class="improve"><div class="grid">${imp(i,'unidad','Unidad')}${imp(i,'descripcion','Descripción')}${imp(i,'und','Und')}${imp(i,'cantidad','Cantidad','number')}${imp(i,'unitario','Costo unitario','number')}</div><button class="btn danger" onclick="state.improvements.splice(${i},1);render()">Eliminar</button></div>`).join('')}<button class="btn" onclick="state.improvements.push({});render()">＋ Agregar mejora</button></section>`}
function imp(i,k,l,type='text'){return `<label>${l}<input type="${type}" value="${esc(state.improvements[i][k]||'')}" onchange="state.improvements[${i}]['${k}']=this.value"></label>`}
function fotos(){return `<section class="card"><h2>Registro fotográfico</h2><p class="help">Las fotos se comprimen para ahorrar espacio y se insertan en la hoja REG. FOTOGRAFICO.</p><div class="photo"><div class="meta"><b>Plano o croquis (opcional)</b><div class="muted">Se insertará en la hoja PLANO</div></div>${state.planData?`<img src="${state.planData}" alt="plano"><button class="btn danger" onclick="state.planData=null;render()">✕</button>`:`<input type="file" accept="image/*" capture="environment" onchange="capturePlan(event)">`}</div>${PHOTO_CATS.map((c,i)=>{let p=state.photos[i];return `<div class="photo"><div class="meta"><b>${i+1}. ${c}</b>${p?`<div class="muted">Foto capturada</div>`:''}</div>${p?`<img src="${p.data}" alt="foto"><button class="btn danger" onclick="state.photos[i]=null;render()">✕</button>`:`<input type="file" accept="image/*" capture="environment" onchange="capturePhoto(event,${i})">`}</div>`}).join('')}</section>`}
async function capturePhoto(ev,i){const f=ev.target.files?.[0];if(!f)return;const data=await resizeImage(f,1280,.78);state.photos[i]={name:`${String(i+1).padStart(2,'0')}_${slug(PHOTO_CATS[i])}.jpg`,data};await persist();render();}
async function capturePlan(ev){const f=ev.target.files?.[0];if(!f)return;state.planData=await resizeImage(f,1600,.82);await persist();render();}
function slug(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_|_$/g,'').toLowerCase()}
function resizeImage(file,max,q){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=URL.createObjectURL(file)})}
function gps(){return `<section class="card"><h2>Ubicación del inmueble</h2><p class="help">Pulsa el botón estando en el predio. El navegador solicitará permiso de ubicación.</p><button class="btn" onclick="getGPS()">📍 Capturar GPS</button><div class="grid"><label>Latitud<input value="${esc(state.data.lat||'')}" readonly></label><label>Longitud<input value="${esc(state.data.lon||'')}" readonly></label><label>Precisión (m)<input value="${esc(state.data.accuracy||'')}" readonly></label></div></section>`}
function getGPS(){if(!navigator.geolocation)return alert('Este dispositivo no permite geolocalización.');navigator.geolocation.getCurrentPosition(p=>{state.data.lat=p.coords.latitude;state.data.lon=p.coords.longitude;state.data.accuracy=p.coords.accuracy;persist();render()},e=>alert('No fue posible obtener la ubicación: '+e.message),{enableHighAccuracy:true,timeout:20000,maximumAge:0})}
function resumen(){const pc=state.photos.filter(Boolean).length;return `<section class="card"><h2>Resumen</h2><p><span class="badge">Avalúo ${esc(state.data.avaluo||'sin número')}</span> <span class="badge">${pc}/${PHOTO_CATS.length} fotos</span> <span class="badge">${state.offers.length} ofertas</span> <span class="badge">${state.improvements.length} mejoras</span></p><p><b>Inmueble:</b> ${esc(state.data.direccion||'—')}</p><p><b>Municipio:</b> ${esc(state.data.municipio||'—')}</p><p><b>Matrícula:</b> ${esc(state.data.matricula||'—')}</p><button class="btn green" onclick="generateExcel()">📊 Generar Excel final</button></section><section class="card"><h2>Respaldo</h2><button class="btn secondary" onclick="exportJSON()">Descargar respaldo del avalúo</button> <label class="btn secondary">Importar respaldo<input class="hidden" type="file" accept="application/json" onchange="importJSON(event)"></label></section>`}
function collect(){document.querySelectorAll('#app input,#app textarea').forEach(el=>{if(el.id)state.data[el.id]=el.value});}
function openDraftDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('AutoAvaluosDB',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('drafts'))req.result.createObjectStore('drafts')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function persist(){try{const db=await openDraftDB();await new Promise((resolve,reject)=>{const tx=db.transaction('drafts','readwrite');tx.objectStore('drafts').put(JSON.parse(JSON.stringify(state)),'current');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close();}catch(e){console.warn('No se pudo guardar en almacenamiento local',e);try{localStorage.setItem('avaluos_iphone_state',JSON.stringify({...state,photos:[]}))}catch(_){}}}
async function restoreDraft(){try{const db=await openDraftDB();const saved=await new Promise((resolve,reject)=>{const tx=db.transaction('drafts','readonly');const req=tx.objectStore('drafts').get('current');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});db.close();if(saved){Object.assign(state,saved);render();return}}catch(e){console.warn(e)}try{const s=localStorage.getItem('avaluos_iphone_state');if(s){Object.assign(state,JSON.parse(s));await persist()}}catch(e){}render()}
function saveDraft(){collect();persist();status('Borrador guardado en este iPhone.');}
function status(s){document.getElementById('status').textContent=s}
function exportJSON(){collect();const b=new Blob([JSON.stringify(state)],{type:'application/json'});download(b,`avaluo_${state.data.avaluo||'sin_numero'}_respaldo.json`)}
function importJSON(ev){const f=ev.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{Object.assign(state,JSON.parse(r.result));render();persist();status('Respaldo importado.')}catch(e){alert('Respaldo inválido')}};r.readAsText(f)}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function generateExcel(){collect();status('Generando Excel…');try{
if(typeof ExcelJS==='undefined')throw new Error('No se cargó el motor ExcelJS. Abre la app con Internet y vuelve a intentarlo.');
const res=await fetch('PLANTILLA_AVALUO.xlsx?v=3',{cache:'no-store'});if(!res.ok)throw new Error('No se encontró PLANTILLA_AVALUO.xlsx en el repositorio.');
const buf=await res.arrayBuffer();const wb=new ExcelJS.Workbook();await wb.xlsx.load(buf);
const d=wb.getWorksheet('DATOS');if(!d)throw new Error('La plantilla no contiene la hoja DATOS.');
const set=(c,v)=>{if(v!==undefined)d.getCell(c).value=(v===''||v===null)?null:v};
set('B1',state.data.avaluo);set('B2',state.data.solicitante);set('B3',state.data.cliente);set('B4',state.data.condicion);set('B6',state.data.tipoIdentificacion||'CC');set('B7',state.data.identificacion);set('B8',state.data.propietario);set('B9',state.data.departamento);set('B10',state.data.municipio);set('B11',state.data.barrio);set('B12',state.data.direccion);set('B13',num(state.data.areaLote));set('B14',num(state.data.areaConstruida));set('B15',state.data.fecha);set('B16',state.data.titulo);set('B17',num(state.data.estrato));set('B18',state.data.matricula);
const info=wb.getWorksheet('INFORMACIÓN GENERAL');if(info){const si=(c,v)=>{if(v!==undefined&&v!=='')info.getCell(c).value=v};si('P51','Avalúo Comercial');si('P52',state.data.tipoSuelo||'Urbano');si('P55',state.data.municipio);si('P56',state.data.barrio);si('P57',state.data.direccion);si('P58',num(state.data.estrato));si('S59',state.data.fecha);si('S63',state.data.propietario);si('K66',state.data.tipoInmueble);si('AB66',state.data.uso);si('K67',state.data.condicion);si('AB67',state.data.matricula);si('K68',state.data.titulo);si('K69',state.data.observacionesJuridicas||state.data.observaciones);if(state.data.lat&&state.data.lon)si('K74',`${state.data.lat}, ${state.data.lon}`);si('K75',state.data.accesibilidad);si('R79',state.data.normatividad);si('R80',state.data.tratamiento);si('R81',state.data.edificabilidad);si('R84',state.data.usoSuelo);si('K87',state.data.actuaciones);si('K88',state.data.observacionesUrbanisticas);si('AB100',state.data.usoPredominante);si('K101',state.data.estadoVias);si('K102',state.data.viasAcceso);si('K103',state.data.parques);si('K104',state.data.zonasVerdes);si('K105',state.data.sardineles);si('K106',state.data.ciclorrutas);si('K107',state.data.alcantarillado);si('K108',state.data.gasNatural);si('AB102',state.data.viasPavimentadas);si('AB103',state.data.alumbrado);si('AB104',state.data.transporte);si('AB105',state.data.andenes);si('AB106',state.data.alamedas);si('AB107',state.data.acueducto);si('AB108',state.data.energia);si('K111',state.data.alcantarillado);si('AB111',state.data.acueducto);si('K112',state.data.gasNatural);si('AB112',state.data.energia);
[['I118','habitaciones'],['Q118','banosPrivados'],['Y118','banosSociales'],['AG118','salas'],['I120','comedores'],['Q120','balcones'],['Y120','patios'],['AG120','depositos'],['I122','estudio'],['Q122','garajes'],['Y122','cocinas'],['AG122','jacuzzi'],['I124','cuartoServicio'],['Q124','pisos'],['Y124','oficinas'],['AG124','bbq']].forEach(([c,k])=>{if(state.data[k]!==undefined&&state.data[k]!=='')si(c,num(state.data[k]))});
[['K129','fachada'],['AB129','ventaneria'],['K130','murosInternos'],['AB130','acabadoPisos'],['K131','acabadoBanos'],['AB131','acabadoCocina'],['K132','carpinteria'],['AB132','vetustez'],['K133','estadoConservacion'],['K134','estadoInmueble'],['AB133','habitado'],['AB134','avanceObra'],['K140','fuenteAreaTerreno'],['AA141','fuenteAreaConstruida'],['A144','observacionesArea']].forEach(([c,k])=>{if(state.data[k]!==undefined&&state.data[k]!=='')si(c,state.data[k])});
si('D178',num(state.data.vetustez));si('G178',num(state.data.vidaUtil));si('I178',num(state.data.estadoConservacion));}
const market=wb.getWorksheet('EST MERCADO TERRENO');const dep=wb.getWorksheet('DEPRECIACIÓN OFERTAS');const loc=wb.getWorksheet('LOCALIZACIÓN MERCADO');
state.offers.slice(0,3).forEach((o,i)=>{const r=6+i;cell(market,`A${r}`,i+1);cell(market,`B${r}`,o.tipo);cell(market,`C${r}`,o.direccion);cell(market,`D${r}`,o.fuente||o.url||'');cell(market,`E${r}`,num(o.valor));cell(market,`F${r}`,num(o.areaConstruida));cell(market,`G${r}`,num(o.areaTerreno));cell(market,`J${r}`,pct(o.negociacion));if(dep){const dr=3+i;cell(dep,`D${dr}`,num(o.edad));cell(dep,`G${dr}`,num(o.vidaUtil));cell(dep,`I${dr}`,num(o.estado));cell(dep,`L${dr}`,num(o.valorReposicion))}if(loc&&o.url){const urlCell=['F50','F59','J59'][i];cell(loc,urlCell,o.url)}});
